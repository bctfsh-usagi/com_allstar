<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>컴투스 올스타 카드 배틀</title>

  <!-- iOS Safari: 홈 화면 추가 시 풀스크린 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="올스타 배틀">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- 안드로이드 Chrome 풀스크린 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050818">

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- 게임 스타일 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- 1. 타이틀 -->
  <div id="title-screen" class="screen active" onclick="goto('hub')">
    <div class="tap-to-start">TAP TO START</div>
  </div>

  <!-- 2. 메인 허브 -->
  <div id="hub-screen" class="screen">
    <div class="top-bar">
      <div class="stat-block">
        <div class="lbl">COLLECTION</div>
        <div class="val" id="hub-collection">0 / 19</div>
      </div>
      <div class="stat-block right">
        <div class="lbl">STREAK</div>
        <div class="val streak" id="hub-streak">0 🔥</div>
      </div>
    </div>

    <div class="hub-body">
      <div class="hub-title">ALLSTAR PACK</div>

      <div class="gacha-pack-wrap">
        <div class="gacha-pack" id="hub-pack" onclick="tryPull()">
          <div class="pack-logo">COM2US<br>ALLSTAR</div>
          <div class="pack-icon">★</div>
          <div class="pack-tag">FREE</div>
        </div>
      </div>

      <div class="cooldown-display">
        <div class="cooldown-status" id="cooldown-status">NEXT FREE PULL</div>
        <div class="cooldown-time" id="cooldown-time">00:30</div>
      </div>

      <div class="probability-info">
        <span class="p5">★5 · 5%</span>
        <span class="p4">★4 · 25%</span>
        <span class="p3">★3 · 70%</span>
      </div>

      <button class="btn-secondary" onclick="skipCooldown()">⏩ 쿨타임 스킵 (데모)</button>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn" onclick="goto('collection')">
        <span class="icon">📚</span> COLLECTION
      </button>
      <button class="nav-btn battle" onclick="goBattle()">
        <span class="icon">⚔️</span> BATTLE
      </button>
    </div>
  </div>

  <!-- 3. 가챠 화면 -->
  <div id="gacha-screen" class="screen">
    <div class="back-btn" onclick="resetGachaScreen(); goto('hub')">✕</div>
    <div class="gacha-body">
      <div class="hub-title">CARD PACK</div>

      <div id="gacha-stage1" class="gacha-stage">
        <div class="opening-pack" id="opening-pack" onclick="openPack()">
          <div class="pack-icon">★</div>
        </div>
        <div class="gacha-instruction" id="gacha-instruction">탭해서 팩을 열어!</div>
      </div>

      <div id="gacha-stage2" class="gacha-stage" style="display:none;">
        <div class="card-reveal" id="card-reveal">
          <div class="card-art" id="reveal-content"></div>
          <div class="reveal-stars" id="reveal-stars">★</div>
        </div>
        <div class="reveal-info" id="reveal-info"></div>
        <button class="btn-primary" onclick="resetGachaScreen(); goto('hub')">계속</button>
      </div>
    </div>
  </div>

  <!-- 4. 컬렉션 -->
  <div id="collection-screen" class="screen">
    <div class="back-btn" onclick="goto('hub')">✕</div>
    <div class="collection-header">
      <div class="hub-title">MY COLLECTION</div>
      <div class="collection-stats" id="collection-stats"></div>
      <div class="collection-tabs" id="collection-tabs"></div>
      <div class="collection-filters" id="collection-filters">
        <button class="filter-btn active" onclick="filterCollection('all', this)">전체</button>
        <button class="filter-btn" onclick="filterCollection(5, this)">★5</button>
        <button class="filter-btn" onclick="filterCollection(4, this)">★4</button>
        <button class="filter-btn" onclick="filterCollection(3, this)">★3</button>
      </div>
    </div>
    <div class="collection-grid" id="collection-grid"></div>
  </div>

  <!-- 5. 카드 선택 -->
  <div id="select-screen" class="screen">
    <div class="back-btn" onclick="goto('hub')">✕</div>
    <div class="select-header">
      <div class="match-label">MATCH</div>
      <div class="match-title">⚔️ REAL-TIME PVP</div>
      <div class="match-streak">STREAK <span id="select-streak">0 🔥</span></div>
    </div>
    <div class="select-body">
      <div class="select-title">카드 선택</div>
      <div class="select-sub">배틀에 내보낼 카드를 선택해</div>
      <div class="select-grid" id="select-grid"></div>
    </div>
  </div>

  <!-- 6. 배틀 -->
  <div id="battle-screen" class="screen">
    <div class="battle-header">
      <div class="live-badge">🔥 LIVE</div>
      <div class="battle-streak">STREAK <span id="battle-streak">0 🔥</span></div>
    </div>
    <div class="battle-arena">
      <div class="battle-side opponent">
        <div class="side-label">OPPONENT</div>
        <div class="battle-card" id="opp-card"></div>
      </div>
      <div class="vs-divider">VS</div>
      <div class="battle-side player">
        <div class="side-label">YOU</div>
        <div class="battle-card" id="my-card"></div>
      </div>
    </div>
    <div class="battle-vs" id="battle-vs">VS</div>
  </div>

  <!-- 7. 결과 -->
  <div id="result-screen" class="screen">
    <div class="result-body">
      <div class="result-icon" id="result-icon">🏆</div>
      <div class="result-title" id="result-title">VICTORY!</div>
      <div class="result-info" id="result-info"></div>
      <div class="result-streak" id="result-streak"></div>
      <div class="result-buttons">
        <button class="btn-secondary" onclick="goto('hub')">허브</button>
        <button class="btn-primary" onclick="goBattle()">다시 배틀</button>
      </div>
    </div>
  </div>

  <!-- 카드 상세 모달 -->
  <div id="card-modal" class="modal-overlay">
    <div class="modal-card" id="modal-card-content"></div>
    <button class="modal-close" onclick="closeCardModal()">닫기</button>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>
</div>

<!-- 게임 코드: 순서 중요 (cards → game → ui) -->
<script src="js/cards.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>

<script>
// AD EMERGENCY AUTH OFF: 로그인/회원가입 임시 비활성화
window.startGame = function(){ if (typeof goto === 'function') goto('hub'); };
window.authSubmit = function(){ console.warn('Auth disabled by emergency patch'); if (typeof goto === 'function') goto('hub'); };
window.loginEmail = window.signupEmail = window.loginGoogle = window.saveNickname = function(){ if (typeof toast === 'function') toast('로그인은 임시 비활성화됐어'); };
window.logout = function(){ if (typeof goto === 'function') goto('title'); };
document.addEventListener('DOMContentLoaded', function(){
  ['auth-screen','nickname-screen'].forEach(function(id){ var el=document.getElementById(id); if(el) el.remove(); });
  document.querySelectorAll('.user-bar,.auth-body,.auth-panel').forEach(function(el){ el.remove(); });
  var title=document.getElementById('title-screen');
  if(title) title.onclick=function(){ if (typeof goto === 'function') goto('hub'); };
});
</script>
</body>
</html>
